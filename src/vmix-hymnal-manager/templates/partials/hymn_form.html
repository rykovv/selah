<div class="d-flex flex-column h-100 p-3">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-3 flex-shrink-0">
        <h5 class="m-0 fw-bold d-flex align-items-center gap-2">
            <span class="cm-chip cm-chip-violet">
                <i class="bi bi-{{ 'pencil' if hymn else 'plus-lg' }}"></i>
            </span>
            {{ 'Edit Hymn' if hymn else 'New Hymn' }}
        </h5>
        {% if hymn %}
        <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1"
            hx-delete="/hymns/{{ hymn.id }}"
            hx-confirm="Delete this hymn permanently?"
            hx-target="#editor-canvas">
            <i class="bi bi-trash3"></i> Delete
        </button>
        {% endif %}
    </div>

    <form id="hymn-form" class="d-flex flex-column flex-grow-1"
        style="min-height: 0;" onsubmit="return submitHymn(event)">
        <input type="hidden" name="hymn_id" id="hymn-id-field" value="{{ hymn.id if hymn else '' }}">

        <!-- Number + Title row -->
        <div class="row g-2 mb-3 flex-shrink-0">
            <div class="col-md-3">
                <div class="form-floating">
                    <input type="text" name="number" class="form-control" id="hymnNumber"
                        placeholder="101"
                        value="{{ hymn.number if hymn else '' }}" required>
                    <label for="hymnNumber">Number</label>
                </div>
            </div>
            <div class="col-md-9">
                <div class="form-floating">
                    <input type="text" name="title" class="form-control" id="hymnTitle"
                        placeholder="Title"
                        value="{{ hymn.title if hymn else '' }}" required>
                    <label for="hymnTitle">Title</label>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs flex-shrink-0" id="editorTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active d-flex align-items-center gap-1"
                    id="vmix-tab" data-bs-toggle="tab" data-bs-target="#vmix-pane"
                    type="button" role="tab">
                    <i class="bi bi-broadcast"></i> vMix (Live)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link d-flex align-items-center gap-1"
                    id="ppt-tab" data-bs-toggle="tab" data-bs-target="#ppt-pane"
                    type="button" role="tab">
                    <i class="bi bi-file-earmark-slides"></i> PowerPoint
                </button>
            </li>
        </ul>

        <!-- Tab content -->
        <div class="tab-content flex-grow-1 border border-top-0 rounded-bottom overflow-hidden" style="min-height: 0;">

            <!-- vMix pane -->
            <div class="tab-pane fade show active h-100" id="vmix-pane" role="tabpanel">
                <div class="row g-0 h-100 overflow-hidden">
                    <div class="col-md-6 d-flex flex-column border-end h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <i class="bi bi-broadcast text-primary"></i> Source (vMix)
                        </div>
                        <textarea id="vmix-editor"
                            class="form-control border-0 flex-grow-1 p-3 overflow-auto font-monospace bg-transparent"
                            style="resize: none; font-size: 0.8125rem;"
                            oninput="renderPreview('vmix')">{% if hymn %}{% for s in hymn.slides if s.type == 'VMIX' %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% endif %}</textarea>
                    </div>
                    <div class="col-md-6 d-flex flex-column h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <i class="bi bi-eye text-secondary"></i> Preview (vMix)
                        </div>
                        <div id="vmix-preview" class="flex-grow-1 p-3 overflow-auto" style="background: var(--bs-body-bg);"></div>
                    </div>
                </div>
            </div>

            <!-- PPT pane -->
            <div class="tab-pane fade h-100" id="ppt-pane" role="tabpanel">
                <div class="row g-0 h-100 overflow-hidden">
                    <div class="col-md-6 d-flex flex-column border-end h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <i class="bi bi-file-earmark-slides text-primary"></i> Source (PPT)
                        </div>
                        <textarea id="ppt-editor"
                            class="form-control border-0 flex-grow-1 p-3 overflow-auto font-monospace bg-transparent"
                            style="resize: none; font-size: 0.8125rem;"
                            oninput="renderPreview('ppt')">{% if hymn %}{% set ppt_slides = hymn.slides|selectattr('type', 'equalto', 'PPT')|list %}{% if ppt_slides %}{% for s in ppt_slides %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% else %}{% for s in hymn.slides if s.type == 'VMIX' %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% endif %}{% endif %}</textarea>
                    </div>
                    <div class="col-md-6 d-flex flex-column h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <i class="bi bi-eye text-secondary"></i> Preview (PPT)
                        </div>
                        <div id="ppt-preview" class="flex-grow-1 p-3 overflow-auto" style="background: var(--bs-body-bg);"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="submission-container" class="d-none"></div>

        <!-- Save button -->
        <div class="mt-3 d-flex justify-content-end flex-shrink-0">
            <button type="submit" id="save-btn" class="btn btn-success px-4 d-flex align-items-center gap-2"
                style="transition: all 0.25s ease;">
                <i class="bi bi-floppy" id="save-icon"></i>
                <span id="save-label">Save All</span>
            </button>
        </div>
    </form>
</div>

<script>
    function parseText(text) {
        return text.split(/\n\s*\n/).map(function(block) {
            block = block.trim();
            if (!block) return null;
            var match = block.match(/^\[(.*?)\]\s*([\s\S]*)/);
            return match ? { label: match[1], content: match[2] } : { label: '', content: block };
        }).filter(function(x) { return x !== null; });
    }

    function renderPreview(type) {
        var editorId = type === 'vmix' ? 'vmix-editor' : 'ppt-editor';
        var containerId = type === 'vmix' ? 'vmix-preview' : 'ppt-preview';
        var slides = parseText(document.getElementById(editorId).value);
        var container = document.getElementById(containerId);
        container.innerHTML = '';
        if (slides.length === 0) {
            container.innerHTML = '<div class="text-secondary text-center mt-5 small">No content…</div>';
            return;
        }
        slides.forEach(function(slide, index) {
            var badgeClass = 'bg-secondary';
            if (slide.label.toLowerCase().includes('v')) badgeClass = 'bg-primary';
            if (slide.label.toLowerCase().includes('c')) badgeClass = 'bg-success';
            var badge = slide.label ? '<span class="badge ' + badgeClass + ' mb-2">' + slide.label + '</span>' : '';
            var card = document.createElement('div');
            card.className = 'card mb-2 border shadow-sm';
            card.style.borderRadius = '8px';
            card.innerHTML =
                '<div class="card-body p-2" style="font-size:0.8125rem;">' +
                '<div class="d-flex justify-content-between align-items-start mb-1">' + badge +
                '<span class="text-secondary" style="font-size:0.7rem;">Slide ' + (index + 1) + '</span></div>' +
                '<div style="white-space: pre-wrap; color: var(--bs-body-color);">' + slide.content + '</div></div>';
            container.appendChild(card);
        });
    }

    function submitHymn(e) {
        e.preventDefault();

        var btn   = document.getElementById('save-btn');
        var icon  = document.getElementById('save-icon');
        var label = document.getElementById('save-label');
        if (btn.disabled) return false;

        /* Build form data with parsed slides */
        var fd = new FormData();
        var hymnId = document.getElementById('hymn-id-field').value;
        if (hymnId) fd.append('hymn_id', hymnId);
        fd.append('number', document.querySelector('[name="number"]').value);
        fd.append('title',  document.querySelector('[name="title"]').value);

        parseText(document.getElementById('vmix-editor').value).forEach(function(s) {
            fd.append('vmix_labels', s.label);
            fd.append('vmix_contents', s.content);
        });
        parseText(document.getElementById('ppt-editor').value).forEach(function(s) {
            fd.append('ppt_labels', s.label);
            fd.append('ppt_contents', s.content);
        });

        /* Disable button & show spinner */
        btn.disabled = true;
        icon.className = 'spinner-border spinner-border-sm';
        label.textContent = 'Saving…';

        fetch('/hymns/save', {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: fd
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            /* For new hymns, store the id so subsequent saves are updates */
            if (data.is_new && data.hymn_id) {
                document.getElementById('hymn-id-field').value = data.hymn_id;
                /* Switch header from "New Hymn" to "Edit Hymn" */
                var header = document.querySelector('#hymn-form').closest('.d-flex.flex-column')
                    .querySelector('h5');
                if (header) {
                    header.querySelector('i').className = 'bi bi-pencil';
                    header.childNodes[header.childNodes.length - 1].textContent = ' Edit Hymn';
                }
            }

            /* Success animation — flash green checkmark */
            icon.className = 'bi bi-check-lg';
            label.textContent = 'Saved!';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-outline-success');

            setTimeout(function() {
                icon.className = 'bi bi-floppy';
                label.textContent = 'Save All';
                btn.classList.remove('btn-outline-success');
                btn.classList.add('btn-success');
                btn.disabled = false;
            }, 1400);

            /* Refresh the sidebar library list */
            htmx.trigger(document.body, 'refreshLibrary');
        })
        .catch(function() {
            icon.className = 'bi bi-exclamation-triangle';
            label.textContent = 'Error';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-danger');

            setTimeout(function() {
                icon.className = 'bi bi-floppy';
                label.textContent = 'Save All';
                btn.classList.remove('btn-danger');
                btn.classList.add('btn-success');
                btn.disabled = false;
            }, 2000);
        });

        return false;
    }

    renderPreview('vmix');
    renderPreview('ppt');
</script>
