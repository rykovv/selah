{% extends "base.html" %}

{% block content %}
<div style="max-width: 920px;">

    <!-- ── Back + Meta ── -->
    <div class="mb-4">
        <a href="/programs" class="text-decoration-none text-secondary d-inline-flex align-items-center gap-1 mb-3 small">
            <i class="bi bi-arrow-left"></i> Back to Programs
        </a>

        <div class="cm-card">
            <div class="d-flex align-items-center gap-3 p-3 flex-wrap">

                <div class="flex-grow-1" style="min-width: 0;">
                    <label class="form-label fw-semibold text-secondary mb-1" style="font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;">Service Name</label>
                    <input type="text" id="service-name" name="name" value="{{ program.name }}"
                        class="form-control form-control-lg border-0 bg-transparent fw-bold p-0 shadow-none"
                        style="font-size: 1.125rem;">
                </div>

                <div style="width: 240px; flex-shrink: 0;">
                    <label class="form-label fw-semibold text-secondary mb-1" style="font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;">PPT Template</label>
                    <select class="form-select form-select-sm bg-body border" id="ppt-template-select" name="template_id"
                        hx-post="/programs/{{ program.id }}/update_meta"
                        hx-trigger="change"
                        hx-include="#service-name"
                        hx-swap="none">
                        <option value="">— No Template —</option>
                        {% for t in templates %}
                        <option value="{{ t.id }}" {% if program.template_id == t.id %}selected{% endif %}>
                            {{ t.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex flex-column gap-2 ps-3 border-start" style="flex-shrink: 0;">
                    <a href="/programs/{{ program.id }}/download_ppt" target="_blank"
                        class="btn btn-success btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-download"></i> Download PPT
                    </a>
                    <div class="btn-group">
                        <a href="/api/program/{{ program.id }}/json" target="_blank"
                            class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
                            <i class="bi bi-braces"></i> JSON
                        </a>
                        <button class="btn btn-outline-danger btn-sm"
                            hx-delete="/programs/{{ program.id }}"
                            hx-confirm="Delete this program?"
                            hx-target="body">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Order of Service ── -->
    <div class="cm-card">
        <div class="cm-card-header">
            <h5 class="cm-title">
                <span class="cm-chip cm-chip-indigo">
                    <i class="bi bi-list-ol"></i>
                </span>
                Order of Service
            </h5>

            <button class="btn btn-primary btn-sm px-3 d-flex align-items-center gap-2" id="save-btn"
                hx-post="/programs/{{ program.id }}/update_meta"
                hx-include="#service-name, #ppt-template-select"
                hx-swap="none"
                hx-on::after-request="showSavedStatus()">
                <i class="bi bi-floppy"></i>
                Save Changes
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;">
                    <tr>
                        <th style="width: 40px;" class="text-center ps-3 text-secondary border-bottom"></th>
                        <th style="width: 32%;" class="text-secondary border-bottom">Event Title</th>
                        <th style="width: 32%;" class="text-secondary border-bottom">Description / Person</th>
                        <th style="width: 25%;" class="text-secondary border-bottom">PPT Tag</th>
                        <th style="width: 80px;" class="border-bottom"></th>
                    </tr>
                </thead>
                <tbody id="items-container">
                    {% for item in program.items %}
                    {% include "partials/program_row.html" %}
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="p-3 border-top">
            <button class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2"
                hx-post="/programs/{{ program.id }}/add_item"
                hx-target="#items-container"
                hx-swap="beforeend">
                <i class="bi bi-plus-lg"></i> Add Event
            </button>
        </div>
    </div>

</div>

<script>
    function showSavedStatus() {
        var btn = document.getElementById('save-btn');
        var icon = btn.querySelector('i');
        var original = btn.innerHTML;

        btn.innerHTML = '<i class="bi bi-check-lg"></i> Saved!';
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-success');

        setTimeout(function () {
            btn.innerHTML = original;
            btn.classList.remove('btn-success');
            btn.classList.add('btn-primary');
        }, 1500);
    }

    document.addEventListener("DOMContentLoaded", function () {
        var el = document.getElementById('items-container');
        if (el) {
            new Sortable(el, {
                handle: '.handle',
                animation: 150,
                ghostClass: 'table-active',
                onEnd: function () {
                    var itemIds = Array.from(el.children).map(function (row) {
                        return row.getAttribute('data-id');
                    });
                    htmx.ajax('POST', '/programs/{{ program.id }}/reorder', {
                        values: { item_ids: itemIds },
                        swap: 'none'
                    });
                }
            });
        }
    });

    function initAutoResize() {
        document.querySelectorAll('textarea.auto-expand').forEach(function (tx) {
            tx.style.height = tx.scrollHeight + 'px';
            tx.style.overflowY = 'hidden';
            tx.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            });
        });
    }

    document.addEventListener("DOMContentLoaded", initAutoResize);
    document.body.addEventListener('htmx:afterSwap', initAutoResize);
</script>
{% endblock %}
