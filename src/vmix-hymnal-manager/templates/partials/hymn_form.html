<div class="d-flex flex-column h-100">

    <div class="d-flex justify-content-between align-items-center mb-2 flex-shrink-0 pt-1">
        <h4 class="m-0 text-primary d-flex align-items-center gap-2">
            {{ 'Edit Hymn' if hymn else 'New Hymn' }}
        </h4>
        {% if hymn %}
        <button class="btn btn-outline-danger border-0 btn-sm" hx-delete="/hymns/{{ hymn.id }}" hx-confirm="Delete?"
            hx-target="#editor-canvas">
            Delete
        </button>
        {% endif %}
    </div>

    <form action="/hymns/save" method="post" class="d-flex flex-column flex-grow-1" style="min-height: 0;"
        onsubmit="prepareSubmission()">
        {% if hymn %}<input type="hidden" name="hymn_id" value="{{ hymn.id }}">{% endif %}

        <div class="row g-2 mb-2 flex-shrink-0">
            <div class="col-md-3">
                <div class="form-floating">
                    <input type="text" name="number" class="form-control" id="hymnNumber" placeholder="101"
                        value="{{ hymn.number if hymn else '' }}" required>
                    <label>Number</label>
                </div>
            </div>
            <div class="col-md-9">
                <div class="form-floating">
                    <input type="text" name="title" class="form-control" id="hymnTitle" placeholder="Title"
                        value="{{ hymn.title if hymn else '' }}" required>
                    <label>Title</label>
                </div>
            </div>
        </div>

        <ul class="nav nav-tabs flex-shrink-0" id="editorTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="vmix-tab" data-bs-toggle="tab" data-bs-target="#vmix-pane"
                    type="button" role="tab">vMix (Live)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="ppt-tab" data-bs-toggle="tab" data-bs-target="#ppt-pane" type="button"
                    role="tab">PowerPoint</button>
            </li>
        </ul>

        <div class="tab-content flex-grow-1 border border-top-0 rounded-bottom overflow-hidden" style="min-height: 0;">

            <div class="tab-pane fade show active h-100" id="vmix-pane" role="tabpanel">
                <div class="d-flex flex-column h-100">
                    <div class="row g-0 h-100 overflow-hidden">
                        <div class="col-md-6 d-flex flex-column border-end bg-light h-100">
                            <div class="p-2 bg-secondary text-white small fw-bold">SOURCE (vMix)</div>
                            <textarea id="vmix-editor"
                                class="form-control border-0 flex-grow-1 p-3 overflow-auto font-monospace"
                                style="resize: none;"
                                oninput="renderPreview('vmix')">{% if hymn %}{% for s in hymn.slides if s.type == 'VMIX' %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% endif %}</textarea>
                        </div>
                        <div class="col-md-6 d-flex flex-column bg-white h-100">
                            <div class="p-2 bg-dark text-white small fw-bold">PREVIEW (vMix)</div>
                            <div id="vmix-preview" class="flex-grow-1 p-3 overflow-auto bg-light"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade h-100" id="ppt-pane" role="tabpanel">
                <div class="d-flex flex-column h-100">
                    <div class="row g-0 h-100 overflow-hidden">
                        <div class="col-md-6 d-flex flex-column border-end bg-light h-100">
                            <div class="p-2 bg-info text-dark small fw-bold">SOURCE (PPT)</div>
                            <textarea id="ppt-editor"
                                class="form-control border-0 flex-grow-1 p-3 overflow-auto font-monospace"
                                style="resize: none;"
                                oninput="renderPreview('ppt')">{% if hymn %}{% set ppt_slides = hymn.slides|selectattr('type', 'equalto', 'PPT')|list %}{% if ppt_slides %}{% for s in ppt_slides %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% else %}{% for s in hymn.slides if s.type == 'VMIX' %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% endif %}{% endif %}</textarea>
                        </div>
                        <div class="col-md-6 d-flex flex-column bg-white h-100">
                            <div class="p-2 bg-dark text-white small fw-bold">PREVIEW (PPT)</div>
                            <div id="ppt-preview" class="flex-grow-1 p-3 overflow-auto bg-light"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="submission-container" class="d-none"></div>

        <div class="mt-2 text-end flex-shrink-0">
            <button type="submit" class="btn btn-success px-4">Save All</button>
        </div>
    </form>
</div>

<script>
    function parseText(text) {
        return text.split(/\n\s*\n/).map(block => {
            block = block.trim();
            if (!block) return null;
            const match = block.match(/^\[(.*?)\]\s*([\s\S]*)/);
            return match ? { label: match[1], content: match[2] } : { label: "", content: block };
        }).filter(x => x !== null);
    }

    function renderPreview(type) {
        const editorId = type === 'vmix' ? 'vmix-editor' : 'ppt-editor';
        const containerId = type === 'vmix' ? 'vmix-preview' : 'ppt-preview';

        const slides = parseText(document.getElementById(editorId).value);
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        if (slides.length === 0) {
            container.innerHTML = '<div class="text-muted text-center mt-5">No content...</div>';
            return;
        }

        slides.forEach((slide, index) => {
            const card = document.createElement('div');
            card.className = 'card mb-2 shadow-sm border-0';

            let badgeClass = 'bg-secondary';
            if (slide.label.toLowerCase().includes('v')) badgeClass = 'bg-primary';
            if (slide.label.toLowerCase().includes('c')) badgeClass = 'bg-success';

            const badge = slide.label ? `<span class="badge ${badgeClass} mb-2">${slide.label}</span>` : '';

            card.innerHTML = `
                <div class="card-body p-2">
                    <div class="d-flex justify-content-between align-items-start">
                        ${badge} <small class="text-muted">Slide ${index + 1}</small>
                    </div>
                    <div class="text-dark" style="white-space: pre-wrap;">${slide.content}</div>
                </div>`;
            container.appendChild(card);
        });
    }

    function prepareSubmission() {
        const container = document.getElementById('submission-container');
        container.innerHTML = '';

        const addInput = (name, val) => {
            const i = document.createElement('input');
            i.type = 'hidden'; i.name = name; i.value = val;
            container.appendChild(i);
        };

        parseText(document.getElementById('vmix-editor').value).forEach(s => {
            addInput('vmix_labels', s.label);
            addInput('vmix_contents', s.content);
        });

        parseText(document.getElementById('ppt-editor').value).forEach(s => {
            addInput('ppt_labels', s.label);
            addInput('ppt_contents', s.content);
        });
    }

    renderPreview('vmix');
    renderPreview('ppt');
</script>
