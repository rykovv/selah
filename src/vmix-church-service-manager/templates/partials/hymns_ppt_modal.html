{# Hymns PPT settings modal with live preview and color pickers.
   Shared by the Hymns view and the Dashboard - include once per page. #}
<!-- ── PPT Settings Modal ── -->
<div class="modal fade" id="pptSettingsModal" tabindex="-1" aria-hidden="true" data-bs-focus="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div class="d-flex align-items-center gap-2">
                    <span class="cm-chip cm-chip-emerald"><i class="bi bi-file-earmark-slides"></i></span>
                    <h5 class="modal-title fw-semibold mb-0">Hymns PPT Settings</h5>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="/download/ppt" method="get" target="_blank">
                <div class="modal-body d-flex flex-column gap-3">

                    <div>
                        <label class="form-label fw-semibold small mb-2">Live Preview</label>
                        <div class="row g-2">
                            <div class="col-6">
                                <div class="ppt-prev-slide" id="pptPrevTitleSlide">
                                    <div id="pptPrevNum">Hymn #123</div>
                                    <div id="pptPrevTitle" style="font-weight: 700;">Amazing Grace</div>
                                </div>
                                <div class="ppt-prev-caption">Title slide</div>
                            </div>
                            <div class="col-6">
                                <div class="ppt-prev-slide" id="pptPrevLyricsSlide">
                                    <div id="pptPrevLyrics">Amazing grace,<br>how sweet the sound</div>
                                </div>
                                <div class="ppt-prev-caption">Lyrics slide</div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="form-label fw-semibold small">Aspect Ratio</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="aspect" id="aspect43" value="4:3" checked>
                                <label class="form-check-label" for="aspect43">Standard (4:3)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="aspect" id="aspect169" value="16:9">
                                <label class="form-check-label" for="aspect169">Widescreen (16:9)</label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="form-label fw-semibold small">Font Family</label>
                        <select class="form-select" name="font_select" id="pptFontSelect"
                            onchange="togglePptManualFont(this)">
                            <option value="Arial" selected>Arial (Universal)</option>
                            <option value="Calibri">Calibri (Modern)</option>
                            <option value="Times New Roman">Times New Roman (Classic)</option>
                            <option value="Verdana">Verdana (Wide)</option>
                            <option value="Tahoma">Tahoma</option>
                            <option value="Century Gothic">Century Gothic</option>
                            <option value="Manual">Manual input…</option>
                        </select>
                        <input type="text" class="form-control mt-2 d-none" name="font_manual" id="pptFontManual"
                            placeholder="Enter font name exactly…">
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold small">Title Size (pt)</label>
                            <input type="number" class="form-control" name="title_size" id="pptTitleSize"
                                value="80" min="20" max="200">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold small">Lyrics Size (pt)</label>
                            <input type="number" class="form-control" name="lyrics_size" id="pptLyricsSize"
                                value="60" min="20" max="200">
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold small">Background Color</label>
                            <div class="clr-field" style="color: #000000;">
                                <button type="button" aria-label="Pick background color"></button>
                                <input type="text" class="form-control" name="bg_color" id="pptBgColor"
                                    value="#000000" data-coloris autocomplete="off">
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold small">Text Color</label>
                            <div class="clr-field" style="color: #FFFFFF;">
                                <button type="button" aria-label="Pick text color"></button>
                                <input type="text" class="form-control" name="text_color" id="pptTextColor"
                                    value="#FFFFFF" data-coloris autocomplete="off">
                            </div>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm d-flex align-items-center gap-2"
                        onclick="bootstrap.Modal.getInstance(document.getElementById('pptSettingsModal')).hide();">
                        <i class="bi bi-download"></i> Download
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Coloris: in-page color picker (native <input type="color"> dialogs are
     unreliable on Windows: the gradient area ignores clicks until a basic
     color has been picked) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@melloware/coloris@0.24.0/dist/coloris.min.css">
<script src="https://cdn.jsdelivr.net/npm/@melloware/coloris@0.24.0/dist/umd/coloris.min.js"></script>
<style>
    /* keep the picker above the Bootstrap modal (z-index 1055) */
    .clr-picker { z-index: 2000; }

    .ppt-prev-slide {
        aspect-ratio: 4 / 3;
        border: 1px solid var(--bs-border-color);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 0.2em;
        padding: 4%;
        overflow: hidden;
        line-height: 1.25;
        word-break: break-word;
        transition: background-color 0.12s ease, color 0.12s ease, aspect-ratio 0.2s ease;
    }
    .ppt-prev-caption {
        text-align: center;
        font-size: 0.7rem;
        color: var(--bs-secondary-color);
        margin-top: 0.3rem;
    }
</style>
<script>
    Coloris({
        alpha: false,
        format: 'hex',
        themeMode: 'auto',
        swatches: [
            '#000000', '#ffffff', '#1a237e', '#004d40',
            '#b71c1c', '#4a148c', '#f5f5dc', '#fff9c4'
        ]
    });

    function togglePptManualFont(select) {
        var el = document.getElementById('pptFontManual');
        if (select.value === 'Manual') {
            el.classList.remove('d-none');
            el.required = true;
            el.focus();
        } else {
            el.classList.add('d-none');
            el.required = false;
        }
        updatePptPreview();
    }

    /* ── Live PPT preview: mirrors the generator's slide layout ── */
    function _prevColor(input, fallback) {
        var v = (input.value || '').trim();
        if (/^#?[0-9a-fA-F]{6}$/.test(v)) return v.charAt(0) === '#' ? v : '#' + v;
        return fallback;
    }

    function updatePptPreview() {
        var titleSlide = document.getElementById('pptPrevTitleSlide');
        var lyricsSlide = document.getElementById('pptPrevLyricsSlide');
        if (!titleSlide || titleSlide.clientWidth === 0) return; // modal not visible yet

        var is43 = document.getElementById('aspect43').checked;
        var slideHeightPt = is43 ? 540 : 648;  // 7.5in / 9in in points

        var fontSel = document.getElementById('pptFontSelect').value;
        var font = fontSel === 'Manual'
            ? (document.getElementById('pptFontManual').value.trim() || 'Arial')
            : fontSel;

        var titlePt = parseFloat(document.getElementById('pptTitleSize').value) || 80;
        var lyricsPt = parseFloat(document.getElementById('pptLyricsSize').value) || 60;
        var bg = _prevColor(document.getElementById('pptBgColor'), '#000000');
        var fg = _prevColor(document.getElementById('pptTextColor'), '#FFFFFF');

        [titleSlide, lyricsSlide].forEach(function (el) {
            el.style.aspectRatio = is43 ? '4 / 3' : '16 / 9';
            el.style.backgroundColor = bg;
            el.style.color = fg;
            el.style.fontFamily = '"' + font + '", sans-serif';
        });

        // Scale real point sizes to preview pixels via the slide height ratio
        var scale = (titleSlide.clientWidth * (is43 ? 3 / 4 : 9 / 16)) / slideHeightPt;
        document.getElementById('pptPrevNum').style.fontSize = (titlePt * 0.5 * scale) + 'px';
        document.getElementById('pptPrevTitle').style.fontSize = (titlePt * scale) + 'px';
        document.getElementById('pptPrevLyrics').style.fontSize = (lyricsPt * scale) + 'px';
    }

    (function () {
        ['pptBgColor', 'pptTextColor', 'pptFontManual'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', updatePptPreview);
        });
        ['pptTitleSize', 'pptLyricsSize'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', updatePptPreview);
        });
        ['aspect43', 'aspect169'].forEach(function (id) {
            document.getElementById(id).addEventListener('change', updatePptPreview);
        });
        document.getElementById('pptSettingsModal')
            .addEventListener('shown.bs.modal', updatePptPreview);
    })();
</script>
