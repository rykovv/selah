{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 900px;">

    <div class="mb-4">
        <a href="/programs" class="text-decoration-none text-muted mb-2 d-inline-block">
            &larr; Back to All Plans
        </a>

        <div class="card shadow-sm border-0 p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center gap-3">

                <div class="flex-grow-1">
                    <label class="small text-muted fw-bold">SERVICE NAME</label>
                    <input type="text" id="service-name" name="name" value="{{ program.name }}"
                        class="form-control form-control-lg fw-bold border-0 bg-light">
                </div>

                <div style="width: 250px;">
                    <label class="small text-muted fw-bold">PPT TEMPLATE</label>
                    <select class="form-select bg-light border-0" id="ppt-template-select" name="template_id"
                        hx-post="/programs/{{ program.id }}/update_meta" hx-trigger="change" hx-include="#service-name"
                        hx-swap="none">

                        <option value="">-- No Template --</option>

                        {% for t in templates %}
                        <option value="{{ t.id }}" {% if program.template_id==t.id %}selected{% endif %}>
                            {{ t.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="text-end ps-3 border-start d-flex flex-column gap-2">
                    <a href="/programs/{{ program.id }}/download_ppt" target="_blank"
                        class="btn btn-success btn-sm fw-bold w-100">
                        Download PPT
                    </a>
                    <div class="btn-group w-100">
                        <a href="/api/program/{{ program.id }}/json" target="_blank"
                            class="btn btn-outline-dark btn-sm">{ } JSON</a>
                        <button class="btn btn-outline-danger btn-sm" hx-delete="/programs/{{ program.id }}"
                            hx-confirm="Delete?" hx-target="body">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow border-0">

        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
            <h5 class="m-0 text-primary">Order of Service</h5>

            <button class="btn btn-primary fw-bold px-4 shadow-sm" id="save-btn"
                hx-post="/programs/{{ program.id }}/update_meta" hx-include="#service-name, #ppt-template-select"
                hx-swap="none" hx-on::after-request="showSavedStatus()">
                Save Changes
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light text-uppercase text-muted small">
                    <tr>
                        <th style="width: 40px;" class="text-center"></th>
                        <th style="width: 32%;">Event Title</th>
                        <th style="width: 32%;">Description / Person</th>
                        <th style="width: 25%;">PPT Tag</th>
                        <th style="width: 80px;"></th>
                    </tr>
                </thead>
                <tbody id="items-container">
                    {% for item in program.items %}
                    {% include "partials/program_row.html" %}
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-light p-3 text-center">
            <button class="btn btn-primary w-100 py-2 fw-bold" hx-post="/programs/{{ program.id }}/add_item"
                hx-target="#items-container" hx-swap="beforeend">
                + Add Event
            </button>
        </div>
    </div>

</div>

<script>
    function showSavedStatus() {
        const btn = document.getElementById('save-btn');
        const originalText = btn.innerHTML;

        // 1. Change visual state to Green/Success
        btn.innerHTML = 'Saved!';
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-success');

        // 2. Revert after 1.5 seconds
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove('btn-success');
            btn.classList.add('btn-primary');
        }, 1500);
    }

    // Initialize SortableJS for drag-and-drop
    document.addEventListener("DOMContentLoaded", function () {
        var el = document.getElementById('items-container');
        if (el) {
            new Sortable(el, {
                handle: '.handle',
                animation: 150,
                ghostClass: 'bg-light',
                onEnd: function (evt) {
                    var itemIds = Array.from(el.children).map(function (row) {
                        return row.getAttribute('data-id');
                    });
                    htmx.ajax('POST', '/programs/{{ program.id }}/reorder', {
                        values: { item_ids: itemIds },
                        swap: 'none'
                    });
                }
            });
        }
    });
    // Auto-resize textareas function
    function initAutoResize() {
        const textareas = document.querySelectorAll('textarea.auto-expand');
        textareas.forEach(tx => {
            // Reset height to shrink if needed, then set to scrollHeight
            tx.setAttribute('style', 'height:' + (tx.scrollHeight) + 'px;overflow-y:hidden;');
            tx.addEventListener("input", OnInput, false);
        });

        function OnInput() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        }
    }

    // Run on load
    document.addEventListener("DOMContentLoaded", initAutoResize);

    // Run after HTMX adds a new row
    document.body.addEventListener('htmx:afterSwap', function (evt) {
        initAutoResize();
    });
</script>
{% endblock %}
