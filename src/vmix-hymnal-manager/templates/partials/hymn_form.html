<div class="d-flex flex-column h-100">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0">
        <h4 class="m-0">{{ 'Edit Hymn' if hymn else 'New Hymn' }}</h4>
        {% if hymn %}
        <button class="btn btn-outline-danger btn-sm" hx-delete="/hymns/{{ hymn.id }}" hx-confirm="Delete this hymn?"
            hx-swap="none">
            Delete
        </button>
        {% endif %}
    </div>

    <form action="/hymns/save" method="post" class="d-flex flex-column flex-grow-1" style="min-height: 0;"
        onsubmit="prepareSubmission()">

        {% if hymn %}
        <input type="hidden" name="hymn_id" value="{{ hymn.id }}">
        {% endif %}

        <div class="row g-2 mb-3 flex-shrink-0">
            <div class="col-md-3">
                <div class="form-floating">
                    <input type="text" name="number" class="form-control" id="hymnNumber" placeholder="101"
                        value="{{ hymn.number if hymn else '' }}" required>
                    <label for="hymnNumber">Number</label>
                </div>
            </div>
            <div class="col-md-9">
                <div class="form-floating">
                    <input type="text" name="title" class="form-control" id="hymnTitle" placeholder="Title"
                        value="{{ hymn.title if hymn else '' }}" required>
                    <label for="hymnTitle">Title</label>
                </div>
            </div>
        </div>

        <div class="row g-0 flex-grow-1 border rounded overflow-hidden" style="min-height: 0;">

            <div class="col-md-6 d-flex flex-column border-end bg-light h-100">
                <div class="p-2 bg-secondary text-white small fw-bold d-flex justify-content-between flex-shrink-0">
                    <span>SOURCE TEXT</span>
                    <span style="opacity: 0.8;">Syntax: [Label] Lyrics</span>
                </div>

                <textarea id="master-editor" class="form-control border-0 flex-grow-1 p-3 overflow-auto"
                    style="resize: none; font-family: monospace; line-height: 1.5; border-radius: 0;"
                    placeholder="[Verse 1]&#10;Amazing grace how sweet the sound&#10;That saved a wretch like me&#10;&#10;[Chorus]&#10;My chains are gone&#10;I've been set free"
                    oninput="renderPreview()"
                    spellcheck="false">{% if hymn %}{% for slide in hymn.slides %}{% if slide.label %}[{{ slide.label }}]&#10;{% endif %}{{ slide.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% endif %}</textarea>
            </div>

            <div class="col-md-6 d-flex flex-column bg-white h-100">
                <div class="p-2 bg-dark text-white small fw-bold flex-shrink-0">
                    <span>SLIDES PREVIEW</span>
                </div>
                <div id="preview-container" class="flex-grow-1 p-3 overflow-auto" style="background-color: #f8f9fa;">
                </div>
            </div>
        </div>

        <div id="submission-container" class="d-none"></div>

        <div class="mt-3 text-end flex-shrink-0">
            <button type="submit" class="btn btn-success px-4">Save Hymn</button>
        </div>
    </form>
</div>

<script>
    /**
     * Parsing Logic (Bracket Based):
     * 1. Split text by DOUBLE Newline (\n\n).
     * 2. Check if block starts with "[Label]".
     */
    function parseBlocks() {
        const rawText = document.getElementById('master-editor').value;
        const blocks = rawText.split(/\n\s*\n/);

        return blocks.map(block => {
            block = block.trim();
            if (!block) return null;

            let label = "";
            let content = block;

            // REGEX UPDATE: 
            // ^\[      -> Starts with open bracket
            // (.*?)    -> Capture anything lazily (the label)
            // \]       -> Closing bracket
            // \s* -> Optional whitespace/newline
            // ([\s\S]*)-> Capture the rest as content
            const match = block.match(/^\[(.*?)\]\s*([\s\S]*)/);

            if (match) {
                label = match[1];   // e.g. "Verse 1"
                content = match[2]; // The lyrics
            }

            return { label, content };
        }).filter(item => item !== null);
    }

    function renderPreview() {
        const slides = parseBlocks();
        const container = document.getElementById('preview-container');
        container.innerHTML = '';

        if (slides.length === 0) {
            container.innerHTML = '<div class="text-muted text-center mt-5">Type on the left...<br><small>Format: [Verse 1] Lyrics</small></div>';
            return;
        }

        slides.forEach((slide, index) => {
            const card = document.createElement('div');
            card.className = 'card mb-3 shadow-sm border-0';

            // Smarter Badge Coloring based on text content
            let badgeClass = 'bg-secondary';
            const lowerLabel = slide.label.toLowerCase();

            if (lowerLabel.includes('v') || lowerLabel.includes('verse')) badgeClass = 'bg-primary';
            else if (lowerLabel.includes('c') || lowerLabel.includes('chorus')) badgeClass = 'bg-success';
            else if (lowerLabel.includes('b') || lowerLabel.includes('bridge')) badgeClass = 'bg-warning text-dark';

            const labelBadge = slide.label
                ? `<span class="badge ${badgeClass} mb-2">${slide.label}</span>`
                : `<span class="badge bg-light text-muted border mb-2">no label</span>`;

            card.innerHTML = `
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start">
                        ${labelBadge}
                        <small class="text-muted">Slide ${index + 1}</small>
                    </div>
                    <div class="text-dark" style="font-size: 1.1rem; white-space: pre-wrap; line-height: 1.4;">${slide.content}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function prepareSubmission() {
        const slides = parseBlocks();
        const container = document.getElementById('submission-container');
        container.innerHTML = '';

        slides.forEach(slide => {
            const inputLabel = document.createElement('input');
            inputLabel.type = 'hidden';
            inputLabel.name = 'slide_labels';
            inputLabel.value = slide.label;
            container.appendChild(inputLabel);

            const inputContent = document.createElement('input');
            inputContent.type = 'hidden';
            inputContent.name = 'slide_contents';
            inputContent.value = slide.content;
            container.appendChild(inputContent);
        });
    }

    renderPreview();
</script>
