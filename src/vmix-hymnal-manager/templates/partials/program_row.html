<tr id="row-{{ item.id }}" data-id="{{ item.id }}" class="align-top">

    <td class="text-center ps-3 handle py-3" style="width: 40px; cursor: move; vertical-align: middle; color: var(--bs-secondary-color);">
        <i class="bi bi-grip-vertical"></i>
    </td>

    <td style="width: 32%;" class="p-2">
        <textarea
            class="form-control border-0 bg-transparent fw-semibold shadow-none auto-expand {{ 'text-secondary opacity-50 text-decoration-line-through' if item.is_muted else '' }}"
            rows="1" name="title" placeholder="Event Title"
            hx-post="/programs/item/{{ item.id }}/update"
            hx-trigger="change"
            hx-include="closest tr">{{ item.title or '' }}</textarea>
    </td>

    <td style="width: 32%;" class="p-2">
        <textarea
            class="form-control border-0 bg-transparent shadow-none auto-expand {{ 'text-secondary opacity-50' if item.is_muted else '' }}"
            rows="1" name="subtitle" placeholder="Description / Person"
            hx-post="/programs/item/{{ item.id }}/update"
            hx-trigger="change"
            hx-include="closest tr">{{ item.subtitle or '' }}</textarea>
    </td>

    <td style="width: 25%;" class="p-2">
        <div class="input-group input-group-sm">
            <span class="input-group-text text-secondary bg-transparent border-secondary-subtle px-1" style="font-size:0.8rem; border-radius: 6px 0 0 6px;">{{'{{}}'[0:2]}}</span>
            <textarea
                class="form-control border-secondary-subtle bg-transparent px-1 font-monospace text-primary fw-semibold shadow-none auto-expand"
                rows="1" name="tag" placeholder="tag"
                style="resize: none; overflow: hidden; font-size: 0.8rem;"
                hx-post="/programs/item/{{ item.id }}/update"
                hx-trigger="change"
                hx-include="closest tr">{{ item.tag or '' }}</textarea>
            <span class="input-group-text text-secondary bg-transparent border-secondary-subtle px-1" style="font-size:0.8rem; border-radius: 0 6px 6px 0;">{{'{{}}'[2:4]}}</span>
        </div>
    </td>

    <td class="text-end align-middle p-2" style="width: 80px;">
        <div class="d-flex gap-1 justify-content-end">
            <button class="btn btn-sm border-0 p-1 {{ 'text-danger' if item.is_muted else 'text-success' }}"
                title="{{ 'Hidden — PPT only' if item.is_muted else 'Visible in vMix & PPT' }}"
                hx-post="/programs/item/{{ item.id }}/toggle_mute"
                hx-target="#row-{{ item.id }}"
                hx-swap="outerHTML">
                {% if item.is_muted %}
                <i class="bi bi-broadcast-pin"></i>
                {% else %}
                <i class="bi bi-broadcast"></i>
                {% endif %}
            </button>

            <button class="btn btn-sm border-0 p-1 text-danger opacity-50"
                title="Remove Item"
                style="transition: opacity 0.15s;"
                onmouseover="this.style.opacity=1"
                onmouseout="this.style.opacity=0.5"
                hx-delete="/programs/item/{{ item.id }}"
                hx-target="#row-{{ item.id }}"
                hx-swap="outerHTML">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </td>
</tr>
