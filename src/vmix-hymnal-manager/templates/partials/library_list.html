{% if library %}
{% for hymn in library %}
<div class="cm-list-item">
    <div class="flex-grow-1 min-w-0 text-truncate">
        <strong style="font-size: 0.875rem;">{{ hymn.number }}</strong>
        <span class="ms-1" style="font-size: 0.875rem;">{{ hymn.title }}</span>
    </div>

    <div class="d-flex gap-1 flex-shrink-0">
        <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
            title="Preview Lyrics"
            hx-get="/hymns/{{ hymn.id }}/preview"
            hx-target="#preview-content"
            data-bs-toggle="modal"
            data-bs-target="#previewModal">
            <i class="bi bi-eye"></i>
        </button>

        <button class="btn btn-sm btn-primary d-flex align-items-center gap-1"
            hx-post="/plan/add"
            hx-vals='{"hymn_id": "{{ hymn.id }}"}'
            hx-target="body">
            <i class="bi bi-plus-lg"></i> Add
        </button>
    </div>
</div>
{% endfor %}
{% else %}
<div class="cm-empty py-4">
    <i class="bi bi-search cm-empty-icon" style="font-size: 1.75rem;"></i>
    <p class="small">No matches found.</p>
</div>
{% endif %}
