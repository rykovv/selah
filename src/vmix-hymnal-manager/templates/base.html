<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vMix Hymn Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Anti-flash: apply stored theme before CSS renders -->
    <script>try { var _t = localStorage.getItem('cm-theme'); if (_t) document.documentElement.setAttribute('data-bs-theme', _t); } catch (e) { }</script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        /* ─── Brand color overrides (indigo replaces Bootstrap blue) ─── */
        :root {
            --bs-primary: #4f46e5;
            --bs-primary-rgb: 79, 70, 229;
            --bs-primary-text-emphasis: #312e81;
            --bs-primary-bg-subtle: #eef2ff;
            --bs-primary-border-subtle: #c7d2fe;
            --bs-link-color: #4f46e5;
            --bs-link-hover-color: #4338ca;

            /* Custom tokens */
            --cm-nav-bg: #1e293b;
            --cm-radius: 10px;
            --cm-radius-lg: 14px;
            --cm-shadow: 0 1px 3px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.04);
            --cm-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.09);
            --cm-emerald: #059669;
            --cm-emerald-bg: rgba(16, 185, 129, 0.10);
            --cm-violet: #7c3aed;
            --cm-violet-bg: rgba(124, 58, 237, 0.10);
            --cm-amber: #d97706;
            --cm-amber-bg: rgba(245, 158, 11, 0.10);
        }

        [data-bs-theme="dark"] {
            --bs-primary: #818cf8;
            --bs-primary-rgb: 129, 140, 248;
            --bs-primary-text-emphasis: #c7d2fe;
            --bs-primary-bg-subtle: rgba(79, 70, 229, 0.18);
            --bs-primary-border-subtle: rgba(79, 70, 229, 0.35);
            --bs-link-color: #818cf8;
            --bs-link-hover-color: #a5b4fc;

            --cm-nav-bg: #0c1220;
            --cm-shadow: 0 1px 3px rgba(0, 0, 0, 0.28);
            --cm-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.45);
            --cm-emerald: #34d399;
            --cm-emerald-bg: rgba(16, 185, 129, 0.15);
            --cm-violet: #a78bfa;
            --cm-violet-bg: rgba(139, 92, 246, 0.15);
            --cm-amber: #fbbf24;
            --cm-amber-bg: rgba(245, 158, 11, 0.15);
        }

        /* ─── Base ─── */
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── Navbar (always dark) ─── */
        .cm-navbar {
            background: var(--cm-nav-bg) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0;
        }

        .cm-navbar .navbar-brand {
            color: #fff !important;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: -0.01em;
            padding: 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }

        .cm-brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(140deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.8125rem;
        }

        .cm-navbar .nav-link {
            color: rgba(255, 255, 255, 0.55) !important;
            font-size: 0.8125rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem !important;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            transition: color 0.15s ease, background 0.15s ease;
            white-space: nowrap;
        }

        .cm-navbar .nav-link:hover {
            color: rgba(255, 255, 255, 0.9) !important;
            background: rgba(255, 255, 255, 0.08);
        }

        .cm-navbar .nav-link.active {
            color: #c7d2fe !important;
            background: rgba(99, 102, 241, 0.28) !important;
        }

        .cm-nav-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
        }

        .cm-theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
            font-size: 0.875rem;
        }

        .cm-theme-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* ─── Card system ─── */
        .cm-card {
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: var(--cm-radius-lg);
            box-shadow: var(--cm-shadow);
            overflow: hidden;
        }

        .cm-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid var(--bs-border-color);
            background: var(--bs-body-bg);
        }

        .cm-card-header .cm-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--bs-body-color);
            margin: 0;
        }

        /* Icon chip colors */
        .cm-chip {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .cm-chip-emerald {
            background: var(--cm-emerald-bg);
            color: var(--cm-emerald);
        }

        .cm-chip-indigo {
            background: var(--bs-primary-bg-subtle);
            color: var(--bs-primary);
        }

        .cm-chip-violet {
            background: var(--cm-violet-bg);
            color: var(--cm-violet);
        }

        .cm-chip-amber {
            background: var(--cm-amber-bg);
            color: var(--cm-amber);
        }

        .cm-chip-muted {
            background: var(--bs-secondary-bg);
            color: var(--bs-secondary-color);
        }

        /* ─── List items ─── */
        .cm-list-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--bs-border-color);
            color: var(--bs-body-color);
            transition: background 0.1s ease;
        }

        .cm-list-item:last-child {
            border-bottom: none;
        }

        .cm-list-item:hover {
            background: var(--bs-tertiary-bg);
        }

        /* ─── Status pills ─── */
        .cm-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .cm-pill-primary {
            background: var(--bs-primary-bg-subtle);
            color: var(--bs-primary);
        }

        .cm-pill-success {
            background: var(--cm-emerald-bg);
            color: var(--cm-emerald);
        }

        .cm-pill-danger {
            background: rgba(220, 38, 38, 0.10);
            color: #dc2626;
        }

        .cm-pill-muted {
            background: var(--bs-secondary-bg);
            color: var(--bs-secondary-color);
        }

        [data-bs-theme="dark"] .cm-pill-danger {
            background: rgba(220, 38, 38, 0.18);
            color: #f87171;
        }

        /* ─── Empty states ─── */
        .cm-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
            color: var(--bs-secondary-color);
            text-align: center;
        }

        .cm-empty-icon {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }

        .cm-empty p {
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* ─── Page header ─── */
        .cm-page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .cm-page-header h2 {
            font-size: 1.3125rem;
            font-weight: 700;
            margin-bottom: 0.1875rem;
            color: var(--bs-body-color);
        }

        .cm-page-header .cm-page-desc {
            font-size: 0.875rem;
            color: var(--bs-secondary-color);
            margin: 0;
        }

        /* ─── Buttons ─── */
        .btn {
            border-radius: 8px;
            font-weight: 500;
        }

        .btn-sm {
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: var(--bs-primary);
            border-color: var(--bs-primary);
        }

        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        [data-bs-theme="dark"] .btn-primary {
            background: var(--bs-primary);
            border-color: var(--bs-primary);
        }

        [data-bs-theme="dark"] .btn-primary:hover {
            background: #6366f1;
            border-color: #6366f1;
        }

        /* ─── Forms ─── */
        .form-control,
        .form-select {
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 0.2rem rgba(var(--bs-primary-rgb), 0.15);
        }

        /* ─── Modals ─── */
        .modal-content {
            border-radius: 16px;
            border-color: var(--bs-border-color);
            box-shadow: var(--cm-shadow-md);
        }

        .modal-header {
            padding: 1.125rem 1.5rem;
        }

        .modal-body {
            padding: 1.25rem 1.5rem;
        }

        .modal-footer {
            padding: 0.875rem 1.5rem;
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bs-border-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--bs-secondary-color);
        }

        /* ─── Program cards (programs list page) ─── */
        .cm-prog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        .cm-prog-card {
            background: var(--bs-body-bg);
            border: 2px solid var(--bs-border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow: hidden;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        /* Pulsing live dot */
        @keyframes cm-live-pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.75);
            }
        }

        .cm-live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            animation: cm-live-pulse 1.6s ease-in-out infinite;
        }

        .cm-prog-card:not(.cm-prog-active):hover {
            border-color: var(--bs-primary);
            box-shadow: var(--cm-shadow-md);
            transform: translateY(-2px);
        }

        .cm-prog-card.cm-prog-active {
            border-color: var(--cm-emerald);
            background: var(--cm-emerald-bg);
        }

        /* ─── Template cards (templates manager page) ─── */
        .cm-tmpl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
            padding: 1rem;
        }

        .cm-tmpl-card {
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow: hidden;
            min-width: 0;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .cm-tmpl-card:hover {
            border-color: rgba(245, 158, 11, 0.45);
            box-shadow: var(--cm-shadow-md);
            transform: translateY(-1px);
        }

        /* Upload drop-zone hint */
        .cm-upload-zone {
            border: 2px dashed var(--bs-border-color);
            border-radius: 10px;
            background: var(--bs-tertiary-bg);
            text-align: center;
            padding: 1.5rem 1rem;
            transition: border-color 0.15s, background 0.15s;
        }

        .cm-upload-zone:has(input[type="file"]:focus-within),
        .cm-upload-zone:hover {
            border-color: var(--cm-amber);
            background: var(--cm-amber-bg);
        }

        /* ─── Dashboard order-of-service rows ─── */
        .cm-oos-row {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 0.6rem 1.25rem;
            border-bottom: 1px solid var(--bs-border-color);
            transition: background 0.1s;
        }

        .cm-oos-row:last-child {
            border-bottom: none;
        }

        .cm-oos-row:hover {
            background: var(--bs-tertiary-bg);
        }

        .cm-oos-num {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--cm-emerald);
            min-width: 20px;
            text-align: right;
            flex-shrink: 0;
            padding-top: 3px;
            opacity: 0.75;
        }

        /* Hymn row — reveal eye button on hover */
        .cm-preview-btn {
            opacity: 0;
            transition: opacity 0.15s;
        }

        .cm-list-item:hover .cm-preview-btn {
            opacity: 1;
        }

        /* ─── Compact list variant ─── */
        .cm-list-item.cm-list-item-sm {
            padding: 0.4rem 1.25rem;
        }

        /* ─── Hymn library number badge ─── */
        .cm-hymn-num {
            font-family: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 2.75rem;
            text-align: right;
            flex-shrink: 0;
            color: var(--bs-primary);
            opacity: 0.75;
            letter-spacing: -0.01em;
        }

        /* ─── Service plan row ─── */
        .cm-plan-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 1.25rem;
            border-bottom: 1px solid var(--bs-border-color);
            transition: background 0.1s;
        }

        .cm-plan-row:last-child {
            border-bottom: none;
        }

        .cm-plan-row:hover {
            background: var(--bs-tertiary-bg);
        }

        .cm-plan-row:hover .cm-drag-handle {
            opacity: 0.7;
        }

        .cm-drag-handle:hover {
            opacity: 1 !important;
        }

        .cm-sortable-ghost {
            opacity: 0.35;
            background: var(--bs-primary-bg-subtle);
        }

        .cm-sortable-chosen {
            background: var(--bs-tertiary-bg);
        }

        /* Two-line clamp for hymn / item titles */
        .cm-title-wrap {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: break-word;
        }

        .cm-plan-seq {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--cm-emerald);
            min-width: 16px;
            text-align: right;
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* Search box with icon */
        .cm-search-wrap {
            position: relative;
        }

        .cm-search-wrap .cm-search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--bs-secondary-color);
            font-size: 0.8rem;
            pointer-events: none;
        }

        .cm-search-wrap input {
            padding-left: 2rem;
        }

        /* ─── Muted rows (program editor table) ─── */
        tr.cm-row-muted {
            opacity: 0.38;
        }

        tr.cm-row-muted textarea[name="title"] {
            text-decoration: line-through;
        }

        /* ─── Program editor top bar ─── */
        .cm-editor-bar {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.75rem 1.25rem;
            background: var(--bs-body-bg);
            border-bottom: 1px solid var(--bs-border-color);
            flex-wrap: wrap;
        }

        .cm-editor-bar .cm-prog-title-input {
            flex-grow: 1;
            min-width: 160px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--bs-body-color);
            background: transparent;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 0.3rem 0.6rem;
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .cm-editor-bar .cm-prog-title-input:hover {
            background: var(--bs-tertiary-bg);
            border-color: var(--bs-border-color);
        }

        .cm-editor-bar .cm-prog-title-input:focus {
            background: var(--bs-body-bg);
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 3px rgba(var(--bs-primary-rgb), 0.12);
        }
        /* ─── Toast notifications ─── */
        .cm-toast-container {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            z-index: 9999;
            display: flex;
            flex-direction: column-reverse;
            gap: 0.5rem;
            pointer-events: none;
        }

        .cm-toast {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.8125rem;
            font-weight: 500;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .cm-toast.cm-toast-show {
            transform: translateX(0);
            opacity: 1;
        }

        .cm-toast.cm-toast-hide {
            transform: translateX(120%);
            opacity: 0;
        }

        .cm-toast-icon {
            font-size: 1.125rem;
            flex-shrink: 0;
        }

        .cm-toast-msg {
            flex: 1;
            line-height: 1.35;
            word-break: break-word;
        }

        .cm-toast-close {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.5;
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            flex-shrink: 0;
            transition: opacity 0.15s;
        }

        .cm-toast-close:hover {
            opacity: 1;
        }

        .cm-toast-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .cm-toast-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .cm-toast-warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        [data-bs-theme="dark"] .cm-toast-error {
            background: #3b1318;
            color: #fca5a5;
            border-color: #6b2028;
        }

        [data-bs-theme="dark"] .cm-toast-success {
            background: #0d2818;
            color: #86efac;
            border-color: #1a4d2e;
        }

        [data-bs-theme="dark"] .cm-toast-warning {
            background: #302010;
            color: #fcd34d;
            border-color: #5c3d1a;
        }
    </style>
</head>

                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Toast container -->
    <div class="cm-toast-container" id="cm-toast-container"></div>

    <script>
        /* ─── Global toast notification ─── */
        (function () {
            var _icons = {
                error: 'bi-x-circle-fill',
                success: 'bi-check-circle-fill',
                warning: 'bi-exclamation-triangle-fill'
            };

            window.cmToast = function (message, type) {
                type = type || 'error';
                var container = document.getElementById('cm-toast-container');
                var toast = document.createElement('div');
                toast.className = 'cm-toast cm-toast-' + type;
                toast.innerHTML =
                    '<i class="cm-toast-icon bi ' + (_icons[type] || _icons.error) + '"></i>' +
                    '<span class="cm-toast-msg">' + message + '</span>' +
                    '<button class="cm-toast-close" aria-label="Close">&times;</button>';

                toast.querySelector('.cm-toast-close').addEventListener('click', function () {
                    dismiss(toast);
                });

                container.appendChild(toast);
                /* Trigger reflow then animate in */
                toast.offsetHeight;
                toast.classList.add('cm-toast-show');

                var timer = setTimeout(function () { dismiss(toast); }, 30000);

                function dismiss(el) {
                    clearTimeout(timer);
                    el.classList.remove('cm-toast-show');
                    el.classList.add('cm-toast-hide');
                    setTimeout(function () { el.remove(); }, 350);
                }
            };
        })();

        /* ─── Global HTMX error handler ─── */
        document.addEventListener('htmx:responseError', function (evt) {
            cmToast('Network error — could not reach the server.', 'error');
        });

        document.addEventListener('htmx:afterRequest', function (evt) {
            var xhr = evt.detail.xhr;
            if (!xhr || xhr.status < 400) return;

            var msg = 'Something went wrong (HTTP ' + xhr.status + ')';
            try {
                var body = JSON.parse(xhr.responseText);
                if (body.detail) msg = body.detail;
            } catch (e) {
                var text = (xhr.responseText || '').trim();
                if (text && text.length < 200) msg = text;
            }
            cmToast(msg, 'error');
        });

        (function () {
            function applyTheme(t) {
                document.documentElement.setAttribute('data-bs-theme', t);
                var icon = document.getElementById('cm-theme-icon');
                if (icon) icon.className = t === 'dark' ? 'bi bi-moon-stars' : 'bi bi-sun';
            }

            var stored = localStorage.getItem('cm-theme') || 'light';
            applyTheme(stored);

            document.getElementById('cm-theme-toggle').addEventListener('click', function () {
                var cur = document.documentElement.getAttribute('data-bs-theme') || 'light';
                var next = cur === 'dark' ? 'light' : 'dark';
                localStorage.setItem('cm-theme', next);
                applyTheme(next);
            });

            // Active nav link detection
            var path = window.location.pathname;
            document.querySelectorAll('.cm-navbar .nav-link[data-cm-path]').forEach(function (link) {
                var dp = link.getAttribute('data-cm-path');
                var active = dp.startsWith('exact:')
                    ? path === dp.slice(6)
                    : (path === dp || path.startsWith(dp + '/'));
                if (active) link.classList.add('active');
            });
        })();
    </script>
</body>

</html>
