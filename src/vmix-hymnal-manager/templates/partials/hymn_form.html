<div class="w-100 h-100 d-flex flex-column">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h3>{{ 'Edit Hymn' if hymn else 'New Hymn' }}</h3>

        {% if hymn %}
        <button class="btn btn-outline-danger btn-sm" hx-delete="/hymns/{{ hymn.id }}"
            hx-confirm="Are you sure? This will remove it from all service plans." onclick="window.location.reload()">
            Delete Hymn
        </button>
        {% endif %}
    </div>

    <div class="card bg-light mb-3 border-secondary">
        <div class="card-header py-1 px-3 pointer" data-bs-toggle="collapse" data-bs-target="#importPanel"
            style="cursor: pointer;">
            <small class="fw-bold text-primary">▼ Import from Text (Click to toggle)</small>
        </div>
        <div id="importPanel" class="collapse">
            <div class="card-body p-2">
                <div class="row g-2">
                    <div class="col-12">
                        <textarea id="raw-import-text" class="form-control form-control-sm" rows="4"
                            placeholder="Paste full hymn text here..."></textarea>
                    </div>
                    <div class="col-auto d-flex align-items-center">
                        <label class="small me-2">Lines per Slide:</label>
                        <input type="number" id="lines-per-slide" class="form-control form-control-sm" value="2" min="1"
                            max="10" style="width: 60px;">
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-sm btn-primary" onclick="processImport()">Generate
                            Slides</button>
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearImport()">Clear
                            Input</button>
                    </div>
                    <div class="col-auto ms-auto">
                        <small class="text-muted">Warning: This replaces current slides below.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <form action="/hymns/save" method="post" class="flex-grow-1 d-flex flex-column" style="min-height: 0;">
        {% if hymn %}
        <input type="hidden" name="hymn_id" value="{{ hymn.id }}">
        {% endif %}

        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label small mb-1">Number</label>
                <input type="text" name="number" class="form-control" value="{{ hymn.number if hymn else '' }}"
                    required>
            </div>
            <div class="col-md-9">
                <label class="form-label small mb-1">Title</label>
                <input type="text" name="title" class="form-control" value="{{ hymn.title if hymn else '' }}" required>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-end mb-1">
            <h6 class="m-0">Slides</h6>
            <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none"
                onclick="document.getElementById('slides-container').innerHTML=''">Clear All Slides</button>
        </div>

        <div id="slides-container" class="overflow-auto mb-3 flex-grow-1 border p-2 rounded bg-white">

            {% if hymn %}
            {% for slide in hymn.slides %}
            <div class="slide-row row mb-2 g-1">
                <div class="col-2">
                    <input type="text" name="slide_labels" class="form-control form-control-sm" placeholder="Label"
                        value="{{ slide.label }}">
                </div>
                <div class="col-9">
                    <textarea name="slide_contents" class="form-control form-control-sm" rows="2"
                        placeholder="Lyrics">{{ slide.content }}</textarea>
                </div>
                <div class="col-1 text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger border-0"
                        onclick="this.closest('.slide-row').remove()">×</button>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <div class="slide-row row mb-2 g-1">
                <div class="col-2">
                    <input type="text" name="slide_labels" class="form-control form-control-sm" placeholder="Label">
                </div>
                <div class="col-9">
                    <textarea name="slide_contents" class="form-control form-control-sm" rows="2"
                        placeholder="Lyrics"></textarea>
                </div>
                <div class="col-1 text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger border-0"
                        onclick="this.closest('.slide-row').remove()">×</button>
                </div>
            </div>
            {% endif %}

        </div>

        <div class="d-flex justify-content-between mt-auto">
            <button type="button" class="btn btn-secondary btn-sm" onclick="addSlide()">+ Add Empty Slide</button>
            <button type="submit" class="btn btn-success">Save Hymn</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function addSlide(content = "", label = "") {
        const container = document.getElementById('slides-container');
        const newRow = document.createElement('div');
        newRow.className = 'slide-row row mb-2 g-1';
        newRow.innerHTML = `
            <div class="col-2">
                <input type="text" name="slide_labels" class="form-control form-control-sm" placeholder="Label" value="${label}">
            </div>
            <div class="col-9">
                <textarea name="slide_contents" class="form-control form-control-sm" rows="2" placeholder="Lyrics">${content}</textarea>
            </div>
            <div class="col-1 text-center">
                <button type="button" class="btn btn-sm btn-outline-danger border-0" onclick="this.closest('.slide-row').remove()">×</button>
            </div>
        `;
        container.appendChild(newRow);
        return container;
    }

    function processImport() {
        const rawText = document.getElementById('raw-import-text').value;
        const linesPerSlide = parseInt(document.getElementById('lines-per-slide').value) || 2;
        const container = document.getElementById('slides-container');

        if (!rawText.trim()) return;

        // 1. Clear existing slides
        container.innerHTML = '';

        // 2. Split text by newlines
        // We split by newline, then filter out completely empty lines to avoid blank slides
        const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        // 3. Chunk the lines
        for (let i = 0; i < lines.length; i += linesPerSlide) {
            const chunk = lines.slice(i, i + linesPerSlide);
            const slideContent = chunk.join('\n');

            // Add the slide (Leave label blank for user to fill)
            addSlide(slideContent, "");
        }

        // 4. Scroll to bottom
        container.scrollTop = container.scrollHeight;
    }

    function clearImport() {
        document.getElementById('raw-import-text').value = '';
    }
</script>
