{% extends "base.html" %}

{% block content %}
<div class="cm-page-header">
    <div>
        <h2>Service Programs</h2>
        <p class="cm-page-desc">Manage your orders of service.</p>
    </div>

    <div class="d-flex align-items-center gap-2 flex-wrap">
        <a href="/templates_manager" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
            <i class="bi bi-layout-text-window-reverse"></i>
            Templates
        </a>
        <a href="/api/program/current" target="_blank"
            class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
            <i class="bi bi-broadcast"></i>
            vMix Feed
        </a>
        <form action="/programs/new" method="post">
            <button type="submit" class="btn btn-primary btn-sm d-flex align-items-center gap-1">
                <i class="bi bi-plus-lg"></i>
                New Program
            </button>
        </form>
    </div>
</div>

<div class="cm-card">
    <div id="program-list">
        {% include "partials/program_list.html" %}
    </div>
</div>
{% endblock %}
