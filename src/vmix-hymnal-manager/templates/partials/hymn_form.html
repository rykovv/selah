<div class="d-flex flex-column h-100 p-3">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-3 flex-shrink-0">
        <h5 class="m-0 fw-bold d-flex align-items-center gap-2">
            <span class="cm-chip cm-chip-violet">
                <i class="bi bi-{{ 'pencil' if hymn else 'plus-lg' }}"></i>
            </span>
            {{ 'Edit Hymn' if hymn else 'New Hymn' }}
        </h5>
        {% if hymn %}
        <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1"
            hx-delete="/hymns/{{ hymn.id }}"
            hx-confirm="Delete this hymn permanently?"
            hx-target="#editor-canvas">
            <i class="bi bi-trash3"></i> Delete
        </button>
        {% endif %}
    </div>

    <form id="hymn-form" class="d-flex flex-column flex-grow-1"
        style="min-height: 0;" onsubmit="return submitHymn(event)">
        <input type="hidden" name="hymn_id" id="hymn-id-field" value="{{ hymn.id if hymn else '' }}">

        <!-- Number + Title row -->
        <div class="row g-2 mb-3 flex-shrink-0">
            <div class="col-md-3">
                <div class="form-floating">
                    <input type="text" name="number" class="form-control" id="hymnNumber"
                        placeholder="101"
                        value="{{ hymn.number if hymn else '' }}" required>
                    <label for="hymnNumber">Number</label>
                </div>
            </div>
            <div class="col-md-9">
                <div class="form-floating">
                    <input type="text" name="title" class="form-control" id="hymnTitle"
                        placeholder="Title"
                        value="{{ hymn.title if hymn else '' }}" required>
                    <label for="hymnTitle">Title</label>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs flex-shrink-0" id="editorTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active d-flex align-items-center gap-1"
                    id="vmix-tab" data-bs-toggle="tab" data-bs-target="#vmix-pane"
                    type="button" role="tab">
                    <i class="bi bi-broadcast"></i> vMix (Live)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link d-flex align-items-center gap-1"
                    id="ppt-tab" data-bs-toggle="tab" data-bs-target="#ppt-pane"
                    type="button" role="tab">
                    <i class="bi bi-file-earmark-slides"></i> PowerPoint
                </button>
            </li>
        </ul>

        <!-- Tab content -->
        <div class="tab-content flex-grow-1 border border-top-0 rounded-bottom overflow-hidden" style="min-height: 0;">

            <!-- vMix pane -->
            <div class="tab-pane fade show active h-100" id="vmix-pane" role="tabpanel">
                <div class="row g-0 h-100 overflow-hidden">
                    <div class="col-md-6 d-flex flex-column border-end h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center justify-content-between"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <span class="d-flex align-items-center gap-2">
                                <i class="bi bi-broadcast text-primary"></i> Source (vMix)
                            </span>
                            <span class="d-flex align-items-center gap-1" style="text-transform: none; letter-spacing: normal; font-weight: 400;">
                                <label for="vmix-line-limit" class="text-nowrap" title="Characters per line before wrap warning">Wrap</label>
                                <input type="number" id="vmix-line-limit" class="form-control form-control-sm"
                                    style="width: 56px; font-size: 0.7rem; padding: 0.15rem 0.3rem;" min="1"
                                    oninput="onLimitChange('vmix')" placeholder="--">
                            </span>
                        </div>
                        <div class="editor-wrap flex-grow-1" style="position: relative; overflow: hidden;">
                            <div id="vmix-backdrop" class="editor-backdrop"></div>
                            <textarea id="vmix-editor" class="editor-textarea"
                                oninput="onEditorInput('vmix')"
                                onscroll="syncScroll('vmix')">{% if hymn %}{% for s in hymn.slides if s.type == 'VMIX' %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% endif %}</textarea>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex flex-column h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <i class="bi bi-eye text-secondary"></i> Preview (vMix)
                        </div>
                        <div id="vmix-preview" class="flex-grow-1 p-3 overflow-auto" style="background: var(--bs-body-bg);"></div>
                    </div>
                </div>
            </div>

            <!-- PPT pane -->
            <div class="tab-pane fade h-100" id="ppt-pane" role="tabpanel">
                <div class="row g-0 h-100 overflow-hidden">
                    <div class="col-md-6 d-flex flex-column border-end h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center justify-content-between"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <span class="d-flex align-items-center gap-2">
                                <i class="bi bi-file-earmark-slides text-primary"></i> Source (PPT)
                            </span>
                            <span class="d-flex align-items-center gap-1" style="text-transform: none; letter-spacing: normal; font-weight: 400;">
                                <label for="ppt-line-limit" class="text-nowrap" title="Characters per line before wrap warning">Wrap</label>
                                <input type="number" id="ppt-line-limit" class="form-control form-control-sm"
                                    style="width: 56px; font-size: 0.7rem; padding: 0.15rem 0.3rem;" min="1"
                                    oninput="onLimitChange('ppt')" placeholder="--">
                            </span>
                        </div>
                        <div class="editor-wrap flex-grow-1" style="position: relative; overflow: hidden;">
                            <div id="ppt-backdrop" class="editor-backdrop"></div>
                            <textarea id="ppt-editor" class="editor-textarea"
                                oninput="onEditorInput('ppt')"
                                onscroll="syncScroll('ppt')">{% if hymn %}{% set ppt_slides = hymn.slides|selectattr('type', 'equalto', 'PPT')|list %}{% if ppt_slides %}{% for s in ppt_slides %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% else %}{% for s in hymn.slides if s.type == 'VMIX' %}{% if s.label %}[{{ s.label }}]&#10;{% endif %}{{ s.content }}{{ '\n\n' if not loop.last else '' }}{% endfor %}{% endif %}{% endif %}</textarea>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex flex-column h-100">
                        <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2"
                            style="font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);">
                            <i class="bi bi-eye text-secondary"></i> Preview (PPT)
                        </div>
                        <div id="ppt-preview" class="flex-grow-1 p-3 overflow-auto" style="background: var(--bs-body-bg);"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="submission-container" class="d-none"></div>

        <!-- Save button -->
        <div class="mt-3 d-flex justify-content-end flex-shrink-0">
            <button type="submit" id="save-btn" class="btn btn-success px-4 d-flex align-items-center gap-2"
                style="transition: all 0.25s ease;">
                <i class="bi bi-floppy" id="save-icon"></i>
                <span id="save-label">Save All</span>
            </button>
        </div>
    </form>
</div>

<style>
    .editor-wrap { display: flex; flex-direction: column; }
    .editor-backdrop, .editor-textarea {
        font-family: var(--bs-font-monospace);
        font-size: 0.8125rem;
        line-height: 1.5;
        padding: 1rem;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
        border: 0;
    }
    .editor-backdrop {
        position: absolute; inset: 0;
        overflow: auto;
        color: transparent;
        pointer-events: none;
        z-index: 0;
    }
    .editor-backdrop .hl-over {
        background: rgba(220,53,69,0.18);
        border-bottom: 2px solid #dc3545;
        border-radius: 2px;
    }
    .editor-textarea {
        position: relative;
        width: 100%; height: 100%;
        resize: none;
        background: transparent;
        color: var(--bs-body-color);
        caret-color: var(--bs-body-color);
        z-index: 1;
    }
    /* when a limit is active and there are overflows, dim normal text so red pops */
    .editor-textarea.has-overflow { color: var(--bs-body-color); }
</style>

<script>
    function parseText(text) {
        return text.split(/\n\s*\n/).map(function(block) {
            block = block.trim();
            if (!block) return null;
            var match = block.match(/^\[(.*?)\]\s*([\s\S]*)/);
            return match ? { label: match[1], content: match[2] } : { label: '', content: block };
        }).filter(function(x) { return x !== null; });
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    /* ── Backdrop (source-side) highlighting ── */

    function getLimit(type) {
        var v = parseInt(document.getElementById(type + '-line-limit').value, 10);
        return isNaN(v) || v <= 0 ? 0 : v;
    }

    function renderBackdrop(type) {
        var textarea = document.getElementById(type + '-editor');
        var backdrop = document.getElementById(type + '-backdrop');
        var limit = getLimit(type);

        if (!limit) {
            backdrop.innerHTML = '';
            textarea.classList.remove('has-overflow');
            return;
        }

        var text = textarea.value;
        var lines = text.split('\n');
        var hasAny = false;
        var html = lines.map(function(line) {
            if (line.length <= limit) return escapeHtml(line);
            hasAny = true;
            return escapeHtml(line.substring(0, limit)) +
                '<span class="hl-over">' + escapeHtml(line.substring(limit)) + '</span>';
        }).join('\n');

        backdrop.innerHTML = html + '\n';
        textarea.classList.toggle('has-overflow', hasAny);
    }

    function syncScroll(type) {
        var textarea = document.getElementById(type + '-editor');
        var backdrop = document.getElementById(type + '-backdrop');
        backdrop.scrollTop = textarea.scrollTop;
        backdrop.scrollLeft = textarea.scrollLeft;
    }

    function onEditorInput(type) {
        renderBackdrop(type);
        renderPreview(type);
    }

    var _limitSaveTimer = null;
    function onLimitChange(type) {
        onEditorInput(type);
        /* Debounce the save to avoid hammering the API on every keystroke */
        clearTimeout(_limitSaveTimer);
        _limitSaveTimer = setTimeout(function() {
            var data = {};
            data['vmix_line_limit'] = document.getElementById('vmix-line-limit').value || '';
            data['ppt_line_limit'] = document.getElementById('ppt-line-limit').value || '';
            fetch('/api/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }, 500);
    }

    function restoreLimits() {
        fetch('/api/settings').then(function(r) { return r.json(); }).then(function(settings) {
            if (settings.vmix_line_limit) document.getElementById('vmix-line-limit').value = settings.vmix_line_limit;
            if (settings.ppt_line_limit) document.getElementById('ppt-line-limit').value = settings.ppt_line_limit;
            onEditorInput('vmix');
            onEditorInput('ppt');
        });
    }

    /* ── Preview-side rendering ── */

    function formatContent(content, limit) {
        if (!limit) return '<div style="white-space: pre-wrap; color: var(--bs-body-color);">' + escapeHtml(content) + '</div>';

        var lines = content.split('\n');
        var html = lines.map(function(line) {
            if (line.length <= limit) return escapeHtml(line);
            return escapeHtml(line.substring(0, limit)) +
                '<span style="background: rgba(220,53,69,0.15); color: #dc3545; border-bottom: 2px solid #dc3545;">' +
                escapeHtml(line.substring(limit)) + '</span>';
        }).join('\n');

        return '<div style="white-space: pre-wrap; color: var(--bs-body-color);">' + html + '</div>';
    }

    function renderPreview(type) {
        var editorId = type + '-editor';
        var containerId = type + '-preview';
        var slides = parseText(document.getElementById(editorId).value);
        var container = document.getElementById(containerId);
        var limit = getLimit(type);

        container.innerHTML = '';
        if (slides.length === 0) {
            container.innerHTML = '<div class="text-secondary text-center mt-5 small">No content…</div>';
            return;
        }
        slides.forEach(function(slide, index) {
            var badgeClass = 'bg-secondary';
            if (slide.label.toLowerCase().includes('v')) badgeClass = 'bg-primary';
            if (slide.label.toLowerCase().includes('c')) badgeClass = 'bg-success';
            var badge = slide.label ? '<span class="badge ' + badgeClass + ' mb-2">' + slide.label + '</span>' : '';

            var hasOverflow = limit && slide.content.split('\n').some(function(l) { return l.length > limit; });
            var warnBadge = hasOverflow
                ? ' <span class="badge bg-danger mb-2" title="Line exceeds ' + limit + ' characters"><i class="bi bi-exclamation-triangle-fill"></i></span>'
                : '';

            var card = document.createElement('div');
            card.className = 'card mb-2 border shadow-sm';
            if (hasOverflow) card.style.borderColor = '#dc3545';
            card.style.borderRadius = '8px';
            card.innerHTML =
                '<div class="card-body p-2" style="font-size:0.8125rem;">' +
                '<div class="d-flex justify-content-between align-items-start mb-1">' + badge + warnBadge +
                '<span class="text-secondary" style="font-size:0.7rem;">Slide ' + (index + 1) + '</span></div>' +
                formatContent(slide.content, limit) + '</div>';
            container.appendChild(card);
        });
    }

    function submitHymn(e) {
        e.preventDefault();

        var btn   = document.getElementById('save-btn');
        var icon  = document.getElementById('save-icon');
        var label = document.getElementById('save-label');
        if (btn.disabled) return false;

        /* Build form data with parsed slides */
        var fd = new FormData();
        var hymnId = document.getElementById('hymn-id-field').value;
        if (hymnId) fd.append('hymn_id', hymnId);
        fd.append('number', document.querySelector('[name="number"]').value);
        fd.append('title',  document.querySelector('[name="title"]').value);

        parseText(document.getElementById('vmix-editor').value).forEach(function(s) {
            fd.append('vmix_labels', s.label);
            fd.append('vmix_contents', s.content);
        });
        parseText(document.getElementById('ppt-editor').value).forEach(function(s) {
            fd.append('ppt_labels', s.label);
            fd.append('ppt_contents', s.content);
        });

        /* Disable button & show spinner */
        btn.disabled = true;
        icon.className = 'spinner-border spinner-border-sm';
        label.textContent = 'Saving…';

        fetch('/hymns/save', {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: fd
        })
        .then(function(r) {
            if (!r.ok) {
                return r.json().catch(function() { return { detail: 'Failed to save hymn' }; })
                    .then(function(body) { throw new Error(body.detail || 'Failed to save hymn'); });
            }
            return r.json();
        })
        .then(function(data) {
            /* For new hymns, store the id so subsequent saves are updates */
            if (data.is_new && data.hymn_id) {
                document.getElementById('hymn-id-field').value = data.hymn_id;
                /* Switch header from "New Hymn" to "Edit Hymn" */
                var header = document.querySelector('#hymn-form').closest('.d-flex.flex-column')
                    .querySelector('h5');
                if (header) {
                    header.querySelector('i').className = 'bi bi-pencil';
                    header.childNodes[header.childNodes.length - 1].textContent = ' Edit Hymn';
                }
            }

            /* Success animation — flash green checkmark */
            icon.className = 'bi bi-check-lg';
            label.textContent = 'Saved!';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-outline-success');

            setTimeout(function() {
                icon.className = 'bi bi-floppy';
                label.textContent = 'Save All';
                btn.classList.remove('btn-outline-success');
                btn.classList.add('btn-success');
                btn.disabled = false;
            }, 1400);

            /* Refresh the sidebar library list */
            htmx.trigger(document.body, 'refreshLibrary');
        })
        .catch(function(err) {
            var msg = err.message || 'Failed to save hymn';
            if (typeof cmToast === 'function') cmToast(msg, 'error');

            icon.className = 'bi bi-exclamation-triangle';
            label.textContent = 'Error';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-danger');

            setTimeout(function() {
                icon.className = 'bi bi-floppy';
                label.textContent = 'Save All';
                btn.classList.remove('btn-danger');
                btn.classList.add('btn-success');
                btn.disabled = false;
            }, 2000);
        });

        return false;
    }

    /* Render previews immediately, then overlay limits once fetched */
    renderPreview('vmix');
    renderPreview('ppt');
    restoreLimits();
</script>
