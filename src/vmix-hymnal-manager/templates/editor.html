{% extends "base.html" %}

{% block content %}
<div class="cm-card d-flex overflow-hidden" style="height: calc(100vh - 5.5rem); position: relative;">

    <!-- ── Sidebar ── -->
    <div id="sidebar-panel" class="d-flex flex-column border-end"
        style="width: 320px; flex-shrink: 0; min-width: 0; overflow: hidden; background: var(--bs-body-bg);">

        <!-- Sidebar header -->
        <div class="p-3 border-bottom" style="background: var(--bs-body-bg);">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <div class="d-flex align-items-center gap-2">
                    <span class="cm-chip cm-chip-violet">
                        <i class="bi bi-book"></i>
                    </span>
                    <span class="fw-semibold" style="font-size: 0.9375rem;">Library</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-sm btn-primary d-flex align-items-center gap-1"
                        hx-get="/hymns/form" hx-target="#editor-canvas">
                        <i class="bi bi-plus-lg"></i> New Hymn
                    </button>
                    <button class="btn btn-sm btn-outline-secondary border-0 p-1"
                        onclick="toggleSidebar()" title="Collapse sidebar">
                        <i class="bi bi-layout-sidebar-reverse"></i>
                    </button>
                </div>
            </div>

            <input type="text" name="q" class="form-control form-control-sm"
                placeholder="Search number, title, lyrics…"
                autocomplete="off"
                hx-get="/editor/search"
                hx-trigger="keyup changed delay:300ms, search, refreshLibrary from:body"
                hx-target="#editor-list">
        </div>

        <!-- Sidebar list -->
        <div class="flex-grow-1 overflow-auto">
            <div id="editor-list">
                {% include "partials/editor_list.html" %}
            </div>
        </div>
    </div>

    <!-- ── Resize handle ── -->
    <div id="drag-handle"
        style="width: 4px; cursor: col-resize; flex-shrink: 0; background: var(--bs-border-color); transition: background 0.15s;"
        onmouseover="this.style.background='var(--bs-primary)'"
        onmouseout="this.style.background='var(--bs-border-color)'">
    </div>

    <!-- ── Editor canvas ── -->
    <div class="flex-grow-1 position-relative d-flex flex-column" style="min-width: 0; background: var(--bs-body-bg);">

        <!-- Expander button (shown when sidebar is collapsed) -->
        <button id="sidebar-expander" class="btn btn-primary position-absolute shadow-sm"
            style="top: 14px; left: 14px; z-index: 100; display: none; width: 36px; height: 36px; padding: 0; border-radius: 8px;"
            onclick="toggleSidebar()" title="Expand sidebar">
            <i class="bi bi-layout-sidebar"></i>
        </button>

        <div id="editor-canvas" class="h-100 w-100" style="transition: padding-left 0.25s ease;">
            <div class="d-flex h-100 justify-content-center align-items-center text-secondary">
                <div class="text-center">
                    <i class="bi bi-pencil-square" style="font-size: 2.5rem; opacity: 0.25; display: block; margin-bottom: 1rem;"></i>
                    <p class="fw-semibold mb-1">Select a hymn to edit</p>
                    <p class="small text-secondary">or click <strong>+ New Hymn</strong> to create one.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var sidebar = document.getElementById('sidebar-panel');
    var handle  = document.getElementById('drag-handle');
    var expander = document.getElementById('sidebar-expander');
    var canvas  = document.getElementById('editor-canvas');
    var isResizing = false;
    var lastWidth = 320;

    handle.addEventListener('mousedown', function () {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', function (e) {
        if (!isResizing) return;
        var containerOffset = sidebar.parentElement.getBoundingClientRect().left;
        var newWidth = e.clientX - containerOffset;

        if (newWidth < 50) {
            newWidth = 0;
            showExpander();
        } else {
            if (newWidth < 180) newWidth = 180;
            if (newWidth > 700) newWidth = 700;
            hideExpander();
            lastWidth = newWidth;
        }
        sidebar.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', function () {
        isResizing = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });

    function toggleSidebar() {
        sidebar.style.transition = 'width 0.25s ease';
        if (sidebar.style.width === '0px') {
            sidebar.style.width = lastWidth + 'px';
            hideExpander();
        } else {
            lastWidth = parseInt(sidebar.style.width) || 320;
            sidebar.style.width = '0px';
            setTimeout(showExpander, 260);
        }
        setTimeout(function () { sidebar.style.transition = ''; }, 300);
    }

    function showExpander() {
        expander.style.display = 'flex';
        expander.style.alignItems = 'center';
        expander.style.justifyContent = 'center';
        canvas.style.paddingLeft = '58px';
    }

    function hideExpander() {
        expander.style.display = 'none';
        canvas.style.paddingLeft = '0';
    }
</script>
{% endblock %}
